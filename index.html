<!DOCTYPE html>
<html lang="en" data-theme="feminine">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deskito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Nunito:wght@400;700&family=Bodoni+Moda:wght@700;800&family=Lato:wght@400;700&family=DM+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="logo">deskito</span>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a href="#" class="nav-item active">Time Tracker</a>
      <a href="#" class="nav-item">Reports</a>
      <a href="#" class="nav-item">Projects</a>
    </nav>

    <main class="content">
      <section class="timer-bar">
        <input type="text" id="description" placeholder="What are you working on?">
        <span id="clock" class="clock">00:00:00</span>
        <button id="start-stop" class="start-button">START</button>
      </section>

      <section class="entries">
        <h2>This week</h2>
        <p id="empty-message" class="empty">No time entries yet. Start the timer to track your first one.</p>
        <ul id="entry-list" class="entry-list"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
